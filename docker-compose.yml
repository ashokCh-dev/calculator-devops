name: calculator

x-calculator: &calculator
  image: ${IMAGE_NAME:-ashokch11/calculator-devops}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  networks:
    - calc-net
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s

services:
  calculator-1:
    <<: *calculator
    container_name: calculator-1
    environment:
      SERVER_PORT: "8080"
      INSTANCE_NAME: calculator-1
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"

  calculator-2:
    <<: *calculator
    container_name: calculator-2
    environment:
      SERVER_PORT: "8080"
      INSTANCE_NAME: calculator-2
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"

  nginx:
    image: nginx:1.27-alpine
    container_name: calculator-nginx
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    depends_on:
      calculator-1:
        condition: service_healthy
      calculator-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  calc-net:
    driver: bridge
