upstream calculator_backend {
    # shared zone so all nginx workers use one round-robin state
    zone calculator_backend 64k;
    server calculator-1:8080 max_fails=3 fail_timeout=10s;
    server calculator-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # small health page for the nginx container itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://calculator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # shows which replica answered (useful in the demo)
        add_header X-Upstream $upstream_addr always;
    }
}
